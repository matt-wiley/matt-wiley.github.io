<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matt Wiley</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    main {
      max-width: 540px;
      width: 100%;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f8fafc;
      margin-bottom: 0.5rem;
    }

    .tagline {
      font-size: 1.05rem;
      color: #94a3b8;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: #7dd3fc;
      text-decoration: none;
      font-size: 0.95rem;
      border: 1px solid #1e3a5f;
      border-radius: 6px;
      padding: 0.4rem 0.85rem;
      transition: border-color 0.15s, color 0.15s;
    }

    .links a:hover {
      color: #bae6fd;
      border-color: #3b82f6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Matt Wiley</h1>
    <p class="tagline">Software engineer. Building things.</p>
    <nav class="links">
      <a href="https://github.com/matt-wiley">GitHub</a>
      <a href="mailto:mattwiley@fastmail.com">Email</a>
    </nav>
  </main>
</body>
</html>
